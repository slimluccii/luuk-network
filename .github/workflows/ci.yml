name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATOCMS_TOKEN: ${{ secrets.DATOCMS_TOKEN }}
      # Only validated by astro check; CI never sends mail or verifies a captcha
      LETTERMINT_TOKEN: ci-placeholder
      CONTACT_SENDER: ci-placeholder
      CONTACT_RECIPIENT: ci-placeholder
      CONTACT_FORM_SECRET: ci-placeholder
      FRIENDLY_CAPTCHA_API_KEY: ci-placeholder
      FRIENDLY_CAPTCHA_SITEKEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run format -- --check
