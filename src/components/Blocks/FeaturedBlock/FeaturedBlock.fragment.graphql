fragment FeaturedBlock on FeaturedBlockRecord {
  title
  pages {
    ... on ProjectRecord {
      id
    }
    ... on PageRecord {
      id
    }
    ... on PostRecord {
      id
    }
  }
  link {
    ... on LinkBlockRecord {
      label
      icon {
        name
      }
      page {
        id
      }
    }
  }
}
